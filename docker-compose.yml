services:
  opendota-mcp:
    build: .
    container_name: opendota-mcp
    restart: unless-stopped
    # Loopback only: the reverse proxy (host-network nginx) reaches it,
    # the outside world cannot.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Persists the endpoint disk cache (parsed matches, constants) across
      # container rebuilds.
      - opendota-cache:/data
    # Every setting is optional and sourced from the shell (or a .env file in
    # this directory — compose reads it automatically for ${VAR} substitution).
    # Defaults below are EMPTY: a bring-your-own-credentials server.
    environment:
      # Access gate: set a secret to require `Authorization: Bearer <secret>`
      # on every request; leave unset for open access.
      - OPENDOTA_HTTP_TOKEN=${OPENDOTA_HTTP_TOKEN:-}
      # Operator's own upstream credentials — omit to make every caller use
      # their own X-OpenDota-Key / X-Stratz-Token headers instead.
      - OPENDOTA_API_KEY=${OPENDOTA_API_KEY:-}
      - STRATZ_API_TOKEN=${STRATZ_API_TOKEN:-}
      # Default name language (schinese, tchinese, russian, ...).
      - OPENDOTA_LANGUAGE=${OPENDOTA_LANGUAGE:-english}
      # Override the STRATZ endpoint (e.g. a relay) if direct access is
      # Cloudflare-blocked from your network.
      # - STRATZ_BASE_URL=https://api.stratz.com/graphql
volumes:
  opendota-cache:
